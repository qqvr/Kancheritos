<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kancheritos</title>

  <link rel="stylesheet" href="main.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body>

  <div class="container">

    <h1>🔐 Iniciar sesión</h1>

    <div class="card">
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Contraseña">
      <button onclick="login()">Entrar</button>
    </div>

    <div id="app" class="hidden">

      <h1>🔎 Buscar producto</h1>

      <div class="search-box">
        <input type="number" id="searchCode" placeholder="Código del producto">
        <button onclick="buscarProducto()">Buscar</button>
      </div>

      <div id="productCard" class="product-card hidden"></div>

      <hr>

      <h2>➕ Agregar producto</h2>

      <div class="card">
        <input type="number" id="code" placeholder="Código">
        <input type="text" id="name" placeholder="Nombre">
        <input type="number" id="price" placeholder="Precio">
        <input type="text" id="provider" placeholder="Proveedor">
        <button onclick="agregarProducto()">Agregar</button>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
